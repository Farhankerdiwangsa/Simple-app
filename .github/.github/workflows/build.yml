name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android --org com.donghuain --project-name donghuain
      - name: Add INTERNET permission (wajib untuk release build)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $f || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $f
          grep -n INTERNET $f
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: donghuain-apk
          path: build/app/outputs/flutter-apk/app-release.apk
